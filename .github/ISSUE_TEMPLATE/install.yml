name: Install problem
description: Sumitsubo does not install, update or load as expected
labels: [install]
body:
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx sumitsubo doctor`
      description: Paste it whole. It shows which plugin failed and why.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11…
