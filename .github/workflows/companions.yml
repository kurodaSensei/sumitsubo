name: companions

# Fifteen of the twenty-one marketplace entries point into repositories this
# project does not control. An author renaming a folder breaks every install of
# that companion on a day when nobody here pushed anything, so the check cannot
# only run on our commits.
on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays, 07:00 UTC
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-companions.mjs
